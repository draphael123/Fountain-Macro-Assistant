<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syncing Personal Macros - Fountain</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .sync-container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0066FF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="sync-container">
        <div class="spinner"></div>
        <h1 id="title">Syncing Personal Macros...</h1>
        <p id="status">Please wait while we save your macros to your account.</p>
    </div>

    <script src="auth.js"></script>
    <script>
        // Get data from URL
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('userId');
        const dataParam = urlParams.get('data');

        if (userId && dataParam) {
            try {
                const macrosData = JSON.parse(decodeURIComponent(dataParam));
                
                // Save to personal macros
                const result = auth.savePersonalMacros(userId, macrosData);
                
                if (result.success) {
                    document.getElementById('title').textContent = 'Success!';
                    document.getElementById('status').textContent = `Saved ${macrosData.macros.length} macro(s) to your account.`;
                    document.getElementById('status').style.color = '#4caf50';
                    
                    // Close after a moment
                    setTimeout(() => {
                        window.close();
                    }, 1500);
                } else {
                    document.getElementById('title').textContent = 'Error';
                    document.getElementById('status').textContent = 'Failed to save macros: ' + (result.error || 'Unknown error');
                    document.getElementById('status').style.color = '#f44336';
                }
            } catch (error) {
                document.getElementById('title').textContent = 'Error';
                document.getElementById('status').textContent = 'Failed to parse macro data: ' + error.message;
                document.getElementById('status').style.color = '#f44336';
            }
        } else {
            document.getElementById('title').textContent = 'Error';
            document.getElementById('status').textContent = 'Missing required parameters.';
            document.getElementById('status').style.color = '#f44336';
        }
    </script>
</body>
</html>
