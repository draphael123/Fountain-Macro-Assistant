<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Fountain - Macro Assistant</title>
    <meta name="description" content="Create a free Fountain account to sync your macros across devices and access the shared macro library.">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4L20 12L16 20L12 12L16 4Z' fill='%230066FF'/%3E%3Cpath d='M12 12L8 16L12 20L16 16L12 12Z' fill='%2300B8FF'/%3E%3Cpath d='M20 12L24 16L20 20L16 16L20 12Z' fill='%2300B8FF'/%3E%3Cpath d='M16 20L12 24L16 28L20 24L16 20Z' fill='%230066FF'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--light-blue) 0%, rgba(0, 184, 255, 0.1) 100%);
            padding: 40px 20px;
        }
        .auth-container {
            width: 100%;
            max-width: 420px;
        }
        .auth-card {
            background: var(--bg-white);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 102, 255, 0.1);
            border: 1px solid var(--border-color);
        }
        .auth-logo {
            text-align: center;
            margin-bottom: 32px;
        }
        .auth-logo a {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .auth-logo .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .auth-title {
            font-size: 28px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            color: var(--text-dark);
        }
        .auth-subtitle {
            text-align: center;
            color: var(--text-gray);
            margin-bottom: 32px;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
        }
        .form-group input {
            padding: 14px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s, box-shadow 0.3s;
            background: var(--bg-white);
            color: var(--text-dark);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(0, 102, 255, 0.1);
        }
        .form-group input::placeholder {
            color: var(--text-light);
        }
        .form-hint {
            font-size: 12px;
            color: var(--text-light);
        }
        .auth-btn {
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            color: white;
        }
        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 102, 255, 0.3);
        }
        .auth-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .auth-switch {
            text-align: center;
            margin-top: 24px;
            color: var(--text-gray);
        }
        .auth-switch a {
            color: var(--primary-blue);
            font-weight: 600;
            text-decoration: none;
        }
        .auth-switch a:hover {
            text-decoration: underline;
        }
        .auth-error {
            background: #FEE2E2;
            border: 1px solid #FECACA;
            color: #DC2626;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .auth-success {
            background: #D1FAE5;
            border: 1px solid #A7F3D0;
            color: #059669;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            display: none;
        }
        .auth-benefits {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
        }
        .auth-benefits h4 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--text-dark);
        }
        .benefit-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .benefit-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-gray);
        }
        .benefit-item span:first-child {
            color: #10B981;
        }

        [data-theme="dark"] .auth-card {
            background: var(--bg-light);
        }
        [data-theme="dark"] .auth-error {
            background: rgba(220, 38, 38, 0.1);
            border-color: rgba(220, 38, 38, 0.3);
        }
        [data-theme="dark"] .auth-success {
            background: rgba(5, 150, 105, 0.1);
            border-color: rgba(5, 150, 105, 0.3);
        }
    </style>
    <script>
        if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
    </script>
</head>
<body>
    <div class="auth-page">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-logo">
                    <a href="/">
                        <svg width="40" height="40" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16 4L20 12L16 20L12 12L16 4Z" fill="#0066FF"/>
                            <path d="M12 12L8 16L12 20L16 16L12 12Z" fill="#00B8FF"/>
                            <path d="M20 12L24 16L20 20L16 16L20 12Z" fill="#00B8FF"/>
                            <path d="M16 20L12 24L16 28L20 24L16 20Z" fill="#0066FF"/>
                        </svg>
                        <span class="logo-text">Fountain</span>
                    </a>
                </div>

                <h1 class="auth-title">Create Account</h1>
                <p class="auth-subtitle">Join Fountain to sync macros across devices</p>

                <div class="auth-error" id="errorMessage"></div>
                <div class="auth-success" id="successMessage"></div>

                <form class="auth-form" id="signupForm">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="John Doe">
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required minlength="6">
                        <span class="form-hint">Must be at least 6 characters</span>
                    </div>

                    <button type="submit" class="auth-btn" id="submitBtn">
                        Create Account
                    </button>
                </form>

                <div class="auth-benefits">
                    <h4>Free account includes:</h4>
                    <div class="benefit-list">
                        <div class="benefit-item">
                            <span>✓</span>
                            <span>Sync macros across all devices</span>
                        </div>
                        <div class="benefit-item">
                            <span>✓</span>
                            <span>Access shared macro library</span>
                        </div>
                        <div class="benefit-item">
                            <span>✓</span>
                            <span>Share your macros with others</span>
                        </div>
                        <div class="benefit-item">
                            <span>✓</span>
                            <span>Cloud backup of all macros</span>
                        </div>
                    </div>
                </div>

                <p class="auth-switch">
                    Already have an account? <a href="login.html">Sign in</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '';
        
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorEl = document.getElementById('errorMessage');
            const successEl = document.getElementById('successMessage');
            
            // Reset messages
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            
            // Disable button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';
            
            try {
                const response = await fetch(`${API_BASE}/api/auth/signup`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Signup failed');
                }
                
                // Show success message
                successEl.innerHTML = data.message || 'Account created! Check your email to verify.';
                successEl.style.display = 'block';
                
                // If session is returned (email verification disabled), log them in
                if (data.session?.access_token) {
                    localStorage.setItem('fountain_token', data.session.access_token);
                    localStorage.setItem('fountain_refresh_token', data.session.refresh_token);
                    localStorage.setItem('fountain_user', JSON.stringify(data.user));
                    
                    setTimeout(() => {
                        window.location.href = '/account.html';
                    }, 1500);
                } else {
                    // Redirect to login after delay
                    setTimeout(() => {
                        window.location.href = '/login.html';
                    }, 3000);
                }
                
            } catch (error) {
                errorEl.textContent = error.message;
                errorEl.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });

        // Check if already logged in
        const token = localStorage.getItem('fountain_token');
        if (token) {
            window.location.href = '/account.html';
        }
    </script>
</body>
</html>
