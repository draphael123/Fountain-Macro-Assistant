<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Fountain - Macro Assistant</title>
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 4L20 12L16 20L12 12L16 4Z' fill='%230066FF'/%3E%3Cpath d='M12 12L8 16L12 20L16 16L12 12Z' fill='%2300B8FF'/%3E%3Cpath d='M20 12L24 16L20 20L16 16L20 12Z' fill='%2300B8FF'/%3E%3Cpath d='M16 20L12 24L16 28L20 24L16 20Z' fill='%230066FF'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: linear-gradient(135deg, var(--light-blue) 0%, rgba(0, 184, 255, 0.1) 100%);
            padding: 40px 20px;
        }
        .error-content {
            max-width: 500px;
        }
        .error-code {
            font-size: 120px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary-blue), var(--secondary-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 20px;
        }
        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        .error-title {
            font-size: 32px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--text-dark);
        }
        .error-message {
            font-size: 18px;
            color: var(--text-gray);
            margin-bottom: 32px;
            line-height: 1.6;
        }
        .error-actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-suggestion {
            margin-top: 40px;
            padding: 20px;
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .error-suggestion h4 {
            font-size: 16px;
            margin-bottom: 12px;
            color: var(--text-dark);
        }
        .error-suggestion-links {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-suggestion-links a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 500;
        }
        .error-suggestion-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-content">
            <div class="error-icon">💧</div>
            <div class="error-code">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-message">Oops! The page you're looking for seems to have evaporated. Let's get you back on track.</p>
            
            <div class="error-actions">
                <a href="/" class="btn btn-primary">Go to Homepage</a>
                <a href="/#download" class="btn btn-secondary">Download Extension</a>
            </div>
            
            <div class="error-suggestion">
                <h4>Looking for something specific?</h4>
                <div class="error-suggestion-links">
                    <a href="/#features">Features</a>
                    <a href="/#guide">User Guide</a>
                    <a href="/#faq">FAQ</a>
                    <a href="/changelog.html">Changelog</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
