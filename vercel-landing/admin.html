<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Fountain</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }
        .admin-header h1 {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .admin-badge {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: var(--bg-white);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            text-align: center;
        }
        .stat-card .stat-value {
            font-size: 36px;
            font-weight: 700;
            color: var(--primary-blue);
        }
        .stat-card .stat-label {
            color: var(--text-gray);
            font-size: 14px;
            margin-top: 8px;
        }
        .users-table {
            background: var(--bg-white);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
        }
        .users-table table {
            width: 100%;
            border-collapse: collapse;
        }
        .users-table th,
        .users-table td {
            padding: 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }
        .users-table th {
            background: var(--bg-light);
            font-weight: 600;
            color: var(--text-dark);
            font-size: 14px;
        }
        .users-table tr:hover {
            background: var(--bg-light);
        }
        .users-table tr:last-child td {
            border-bottom: none;
        }
        .user-email {
            font-weight: 500;
            color: var(--text-dark);
        }
        .user-name {
            color: var(--text-gray);
            font-size: 13px;
        }
        .user-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .badge-admin {
            background: #fef2f2;
            color: #dc2626;
        }
        .badge-user {
            background: #f0fdf4;
            color: #16a34a;
        }
        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            margin-right: 8px;
            transition: all 0.2s;
        }
        .action-btn-edit {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .action-btn-edit:hover {
            background: #bfdbfe;
        }
        .action-btn-delete {
            background: #fee2e2;
            color: #dc2626;
        }
        .action-btn-delete:hover {
            background: #fecaca;
        }
        .action-btn-password {
            background: #fef3c7;
            color: #d97706;
        }
        .action-btn-password:hover {
            background: #fde68a;
        }
        
        /* Login form */
        .login-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: var(--bg-white);
            border: 2px solid var(--border-color);
            border-radius: 16px;
        }
        .login-container h2 {
            text-align: center;
            margin-bottom: 8px;
            color: var(--text-dark);
        }
        .login-container p {
            text-align: center;
            color: var(--text-gray);
            margin-bottom: 24px;
        }
        .login-container .form-group {
            margin-bottom: 20px;
        }
        .login-container label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-dark);
        }
        .login-container input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
        }
        .login-container input:focus {
            outline: none;
            border-color: var(--primary-blue);
        }
        .login-error {
            background: #fef2f2;
            color: #dc2626;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
        }
        .login-error.show {
            display: block;
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active {
            display: flex;
        }
        .modal-content {
            background: var(--bg-white);
            border-radius: 16px;
            padding: 32px;
            max-width: 450px;
            width: 90%;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .modal-header h3 {
            margin: 0;
            color: var(--text-dark);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-gray);
        }
        .modal .form-group {
            margin-bottom: 20px;
        }
        .modal label {
            display: block;
            font-weight: 500;
            margin-bottom: 8px;
        }
        .modal input {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
        }
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 24px;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: var(--text-gray);
        }
        
        .refresh-btn {
            padding: 8px 16px;
            background: var(--bg-light);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }
        .refresh-btn:hover {
            background: var(--primary-blue);
            color: white;
            border-color: var(--primary-blue);
        }
    </style>
</head>
<body>
    <!-- Login Form (shown when not logged in) -->
    <div id="login-section" class="login-container">
        <h2>🔐 Admin Login</h2>
        <p>Enter your admin credentials to continue</p>
        
        <div id="login-error" class="login-error"></div>
        
        <form id="admin-login-form">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="admin@fountain.net" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Your password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">
                Sign In
            </button>
        </form>
    </div>

    <!-- Admin Panel (shown when logged in) -->
    <div id="admin-section" class="admin-container" style="display: none;">
        <div class="admin-header">
            <h1>
                🛡️ Admin Panel
                <span class="admin-badge">ADMIN</span>
            </h1>
            <div>
                <button class="refresh-btn" onclick="loadUsers()">🔄 Refresh</button>
                <button class="btn btn-outline" onclick="logout()" style="margin-left: 12px;">Logout</button>
            </div>
        </div>

        <div class="admin-stats">
            <div class="stat-card">
                <div class="stat-value" id="total-users">-</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="total-macros">-</div>
                <div class="stat-label">Total Macros</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="active-today">-</div>
                <div class="stat-label">Active Today</div>
            </div>
        </div>

        <div class="users-table">
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Role</th>
                        <th>Macros</th>
                        <th>Created</th>
                        <th>Last Login</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="users-list">
                    <tr>
                        <td colspan="6" class="loading">Loading users...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit User</h3>
                <button class="modal-close" onclick="closeModal('edit-modal')">&times;</button>
            </div>
            <form id="edit-form">
                <input type="hidden" id="edit-user-id">
                <div class="form-group">
                    <label>Display Name</label>
                    <input type="text" id="edit-display-name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="edit-email" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal('edit-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Reset Password Modal -->
    <div id="password-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Reset Password</h3>
                <button class="modal-close" onclick="closeModal('password-modal')">&times;</button>
            </div>
            <form id="password-form">
                <input type="hidden" id="password-user-id">
                <p style="color: var(--text-gray); margin-bottom: 20px;">
                    Enter a new password for <strong id="password-user-email"></strong>
                </p>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="new-password" minlength="6" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-outline" onclick="closeModal('password-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Reset Password</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let authToken = localStorage.getItem('fountain_auth_token');
        let users = [];

        // Check if already logged in
        if (authToken) {
            checkAdminAccess();
        }

        // Login form
        document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('login-error');
            
            errorEl.classList.remove('show');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    authToken = data.token;
                    localStorage.setItem('fountain_auth_token', data.token);
                    localStorage.setItem('fountain_user', JSON.stringify(data.user));
                    checkAdminAccess();
                } else {
                    errorEl.textContent = data.error || 'Login failed';
                    errorEl.classList.add('show');
                }
            } catch (error) {
                errorEl.textContent = 'Connection error';
                errorEl.classList.add('show');
            }
        });

        async function checkAdminAccess() {
            try {
                const response = await fetch('/api/admin/users', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('login-section').style.display = 'none';
                    document.getElementById('admin-section').style.display = 'block';
                    displayUsers(data.users);
                } else {
                    // Not an admin
                    document.getElementById('login-error').textContent = 'Admin access required';
                    document.getElementById('login-error').classList.add('show');
                    localStorage.removeItem('fountain_auth_token');
                    authToken = null;
                }
            } catch (error) {
                console.error('Error checking admin access:', error);
            }
        }

        async function loadUsers() {
            try {
                const response = await fetch('/api/admin/users', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayUsers(data.users);
                }
            } catch (error) {
                console.error('Error loading users:', error);
            }
        }

        function displayUsers(userList) {
            users = userList;
            const tbody = document.getElementById('users-list');
            
            // Update stats
            document.getElementById('total-users').textContent = users.length;
            document.getElementById('total-macros').textContent = users.reduce((sum, u) => sum + (u.macroCount || 0), 0);
            
            const today = new Date().toDateString();
            const activeToday = users.filter(u => u.lastLogin && new Date(u.lastLogin).toDateString() === today).length;
            document.getElementById('active-today').textContent = activeToday;
            
            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="loading">No users found</td></tr>';
                return;
            }
            
            tbody.innerHTML = users.map(user => `
                <tr>
                    <td>
                        <div class="user-email">${escapeHtml(user.email)}</div>
                        <div class="user-name">${escapeHtml(user.displayName || 'No name')}</div>
                    </td>
                    <td>
                        <span class="user-badge ${user.isAdmin ? 'badge-admin' : 'badge-user'}">
                            ${user.isAdmin ? 'ADMIN' : 'USER'}
                        </span>
                    </td>
                    <td>${user.macroCount || 0}</td>
                    <td>${user.createdAt ? new Date(user.createdAt).toLocaleDateString() : '-'}</td>
                    <td>${user.lastLogin ? new Date(user.lastLogin).toLocaleString() : 'Never'}</td>
                    <td>
                        <button class="action-btn action-btn-edit" onclick="editUser('${user.id}')">Edit</button>
                        <button class="action-btn action-btn-password" onclick="resetPassword('${user.id}', '${escapeHtml(user.email)}')">Password</button>
                        ${!user.isAdmin ? `<button class="action-btn action-btn-delete" onclick="deleteUser('${user.id}', '${escapeHtml(user.email)}')">Delete</button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }

        function editUser(userId) {
            const user = users.find(u => u.id === userId);
            if (!user) return;
            
            document.getElementById('edit-user-id').value = userId;
            document.getElementById('edit-display-name').value = user.displayName || '';
            document.getElementById('edit-email').value = user.email || '';
            document.getElementById('edit-modal').classList.add('active');
        }

        function resetPassword(userId, email) {
            document.getElementById('password-user-id').value = userId;
            document.getElementById('password-user-email').textContent = email;
            document.getElementById('new-password').value = '';
            document.getElementById('password-modal').classList.add('active');
        }

        async function deleteUser(userId, email) {
            if (!confirm(`Are you sure you want to delete ${email}? This cannot be undone.`)) {
                return;
            }
            
            try {
                const response = await fetch(`/api/admin/users?userId=${userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('User deleted successfully');
                    loadUsers();
                } else {
                    alert(data.error || 'Failed to delete user');
                }
            } catch (error) {
                alert('Error deleting user');
            }
        }

        // Edit form submission
        document.getElementById('edit-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userId = document.getElementById('edit-user-id').value;
            const displayName = document.getElementById('edit-display-name').value;
            const email = document.getElementById('edit-email').value;
            
            try {
                // Update display name
                await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}` 
                    },
                    body: JSON.stringify({
                        targetUserId: userId,
                        action: 'updateDisplayName',
                        data: { displayName }
                    })
                });
                
                // Update email
                await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}` 
                    },
                    body: JSON.stringify({
                        targetUserId: userId,
                        action: 'updateEmail',
                        data: { email }
                    })
                });
                
                closeModal('edit-modal');
                loadUsers();
                alert('User updated successfully');
            } catch (error) {
                alert('Error updating user');
            }
        });

        // Password form submission
        document.getElementById('password-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userId = document.getElementById('password-user-id').value;
            const password = document.getElementById('new-password').value;
            
            try {
                const response = await fetch('/api/admin/users', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}` 
                    },
                    body: JSON.stringify({
                        targetUserId: userId,
                        action: 'resetPassword',
                        data: { password }
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    closeModal('password-modal');
                    alert('Password reset successfully');
                } else {
                    alert(data.error || 'Failed to reset password');
                }
            } catch (error) {
                alert('Error resetting password');
            }
        });

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function logout() {
            localStorage.removeItem('fountain_auth_token');
            localStorage.removeItem('fountain_user');
            authToken = null;
            document.getElementById('login-section').style.display = 'block';
            document.getElementById('admin-section').style.display = 'none';
        }
    </script>
</body>
</html>
