<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Icon Generator for Fountain - Macro Assistant</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }
    .container {
      background: #f5f5f5;
      padding: 30px;
      border-radius: 8px;
    }
    canvas {
      border: 1px solid #ddd;
      margin: 10px;
      display: block;
    }
    button {
      background: #4285f4;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 10px 5px;
    }
    button:hover {
      background: #3367d6;
    }
    .preview {
      display: flex;
      gap: 20px;
      margin: 20px 0;
    }
    .icon-preview {
      text-align: center;
    }
    .icon-preview h3 {
      margin: 10px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Fountain - Macro Assistant Icon Generator</h1>
    <p>This tool helps you create simple placeholder icons for the extension.</p>
    
    <div class="preview">
      <div class="icon-preview">
        <h3>16x16</h3>
        <canvas id="icon16" width="16" height="16"></canvas>
      </div>
      <div class="icon-preview">
        <h3>48x48</h3>
        <canvas id="icon48" width="48" height="48"></canvas>
      </div>
      <div class="icon-preview">
        <h3>128x128</h3>
        <canvas id="icon128" width="128" height="128"></canvas>
      </div>
    </div>

    <div>
      <button onclick="generateIcons()">Generate Icons</button>
      <button onclick="downloadAll()">Download All Icons</button>
    </div>

    <p style="margin-top: 20px; color: #666;">
      <strong>Note:</strong> These are simple placeholder icons. For production, 
      consider creating professional icons using design software or online tools.
    </p>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      
      // Clear canvas
      ctx.clearRect(0, 0, size, size);
      
      // Draw background (blue)
      ctx.fillStyle = '#4285f4';
      ctx.fillRect(0, 0, size, size);
      
      // Draw rounded corners (simple approximation)
      const radius = size * 0.15;
      ctx.globalCompositeOperation = 'destination-in';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, radius);
      ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      
      // Draw text "TE"
      ctx.fillStyle = 'white';
      ctx.font = `bold ${size * 0.5}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('FA', size / 2, size / 2);
    }

    // Polyfill for roundRect if not available
    if (!CanvasRenderingContext2D.prototype.roundRect) {
      CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
        this.beginPath();
        this.moveTo(x + radius, y);
        this.lineTo(x + width - radius, y);
        this.quadraticCurveTo(x + width, y, x + width, y + radius);
        this.lineTo(x + width, y + height - radius);
        this.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        this.lineTo(x + radius, y + height);
        this.quadraticCurveTo(x, y + height, x, y + height - radius);
        this.lineTo(x, y + radius);
        this.quadraticCurveTo(x, y, x + radius, y);
        this.closePath();
      };
    }

    function generateIcons() {
      drawIcon(document.getElementById('icon16'), 16);
      drawIcon(document.getElementById('icon48'), 48);
      drawIcon(document.getElementById('icon128'), 128);
    }

    function downloadCanvas(canvas, filename) {
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      });
    }

    function downloadAll() {
      generateIcons();
      setTimeout(() => {
        downloadCanvas(document.getElementById('icon16'), 'icon16.png');
        setTimeout(() => {
          downloadCanvas(document.getElementById('icon48'), 'icon48.png');
          setTimeout(() => {
            downloadCanvas(document.getElementById('icon128'), 'icon128.png');
          }, 200);
        }, 200);
      }, 100);
    }

    // Generate on load
    window.onload = generateIcons;
  </script>
</body>
</html>
